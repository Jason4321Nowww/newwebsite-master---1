services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - bkp_internal

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/bkp
      JWT_SECRET: ${JWT_SECRET}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET}
      NODE_ENV: production
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_PASS: ${GMAIL_PASS}
      ALLOWED_ORIGINS: https://bkp.vekon.studio
      CLIENT_URL: https://bkp.vekon.studio
      PORT: 5000
    volumes:
      - server_uploads:/app/uploads
    ports:
      - "127.0.0.1:5306:5000"
    networks:
      - bkp_internal

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:3306:80"
    networks:
      - bkp_internal

volumes:
  mongo_data:
  server_uploads:

networks:
  bkp_internal:
    driver: bridge