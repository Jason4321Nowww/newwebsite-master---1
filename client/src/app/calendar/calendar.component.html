<div class="calendar-container">
  <!-- Calendar Header -->
  <div class="calendar-header">
    <button (click)="prevMonth()">&laquo;</button>
    <h3>{{ currentMonth | date: 'MMMM yyyy' }}</h3>
    <button (click)="nextMonth()">&raquo;</button>
  </div>

  <!-- Week Day Headers -->
  <div class="calendar-grid">
    <div class="calendar-day" *ngFor="let key of weekDayKeys">{{ langService.t(key) }}</div>

    <!-- Calendar Cells: null = empty padding, object = real day -->
    <ng-container *ngFor="let date of calendarDates">

      <!-- Empty padding cell (before month starts) -->
      <div class="calendar-cell empty-cell" *ngIf="date === null"></div>

      <!-- Real day cell -->
      <div
        class="calendar-cell"
        *ngIf="date !== null"
      >
        <div class="date-label">{{ date!.date.getDate() }}</div>

        <!-- Event indicators (one per event on this day) -->
        <div class="event-dots">
          <div
            *ngFor="let evt of date!.events"
            class="event-dot"
            [ngClass]="{ 'mobile-view': isMobile, 'desktop-view': !isMobile }"
            [matTooltip]="getTooltipText(evt)"
            matTooltipPosition="above"
            matTooltipClass="custom-tooltip"
          >
            <mat-icon *ngIf="isRepeating(evt)" class="repeat-icon">autorenew</mat-icon>
            <mat-icon *ngIf="!isRepeating(evt)" class="one-time-icon">event</mat-icon>
          </div>
        </div>
      </div>

    </ng-container>
  </div>
</div>
