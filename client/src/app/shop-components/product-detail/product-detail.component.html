<div class="product-detail">
  <div class="product-detail__image">
    <img [src]="'' + product.mediaUrl" [alt]="product.name" />
  </div>

  <div class="product-detail__info">
    <!-- Warning if stock is 0 or exceeded -->
    <p *ngIf="product.stockWarning" class="stock-warning">
      {{ langService.t('shop.noStock') }}
    </p>
    <h2>{{ langService.getField(product, 'name') }}</h2>
    <p class="description">{{ langService.getField(product, 'description') }}</p>

    <!-- ✅ Show only for NON-external products -->
    <ng-container *ngIf="!product.isExternal; else externalBlock">
      <p class="price">{{ langService.t('shop.price') }}: {{ product.price.toFixed(2) }}</p>

      <div class="quantity-controls">
        <button (click)="decreaseQty()">−</button>
        <input type="number" [value]="quantity" readonly />
        <button (click)="increaseQty()">+</button>
      </div>

      <button class="btn primary" (click)="addToCart()">{{ langService.t('shop.addToCart') }}</button>
      <button class="btn secondary" routerLink="/order">{{ langService.t('shop.goToCart') }}</button>
    </ng-container>

    <!-- ✅ External product block -->
    <ng-template #externalBlock>
      <a [href]="product.externalUrl" target="_blank" class="btn primary">
        {{ langService.t('shop.externalItem') }}
      </a>
    </ng-template>
  </div>
</div>
