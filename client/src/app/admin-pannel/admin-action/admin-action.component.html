<div class="action-wrapper admin-card">


  <form [formGroup]="actionForm" (ngSubmit)="submitForm()">

    <!-- Language Picker + Chips -->
    <div class="form-header">
      <span class="form-section-title">{{ isEditing ? 'Edit Action' : 'New Action' }}</span>
    </div>
    <div class="lang-tabs">
      <div *ngFor="let l of selectedLangs"
           class="lang-tab"
           [class.active]="activeLang === l"
           (click)="onLangChange(l)">
        <img [src]="langMeta[l].flag" [alt]="langMeta[l].label" class="lang-flag" /><span class="lang-tab-label">{{ langMeta[l].label }}</span>
        <span *ngIf="l !== 'de'" class="lang-tab-remove" (click)="$event.stopPropagation(); removeLang(l)" title="Remove language">×</span>
      </div>
      <div class="lang-add-wrapper" *ngIf="availableLangs.length > 0" (click)="$event.stopPropagation()">
        <button type="button" class="lang-add-btn" (click)="showLangDropdown = !showLangDropdown" title="Add language">+</button>
        <div class="lang-add-dropdown" *ngIf="showLangDropdown && availableLangs.length > 0">
          <div *ngFor="let l of availableLangs" class="lang-add-option" (click)="onLangChange(l); showLangDropdown = false">
            <img [src]="langMeta[l].flag" [alt]="langMeta[l].label" class="lang-flag" />
            <span>{{ langMeta[l].label }}</span>
          </div>
        </div>
      </div>
    </div>

    <label *ngIf="activeLang === 'de'">Title (DE)
      <input formControlName="title" type="text" required />
    </label>
    <label *ngIf="activeLang === 'it'">Title (IT)
      <input formControlName="title_it" type="text" />
    </label>
    <label *ngIf="activeLang === 'fr'">Title (FR)
      <input formControlName="title_fr" type="text" />
    </label>
    <label *ngIf="activeLang === 'en'">Title (EN)
      <input formControlName="title_en" type="text" />
    </label>

    <label *ngIf="activeLang === 'de'">Description (DE)
      <textarea formControlName="description" required></textarea>
    </label>
    <label *ngIf="activeLang === 'it'">Description (IT)
      <textarea formControlName="description_it"></textarea>
    </label>
    <label *ngIf="activeLang === 'fr'">Description (FR)
      <textarea formControlName="description_fr"></textarea>
    </label>
    <label *ngIf="activeLang === 'en'">Description (EN)
      <textarea formControlName="description_en"></textarea>
    </label>

    <!-- Media Upload -->
    <label>Media (Images or Videos)
      <input
  type="file"
  multiple
  accept="image/*,video/*"
  (change)="onMediaSelected($event)"
/>

    </label>

    <!-- Preview -->
    <div class="media-preview">
      <ng-container *ngFor="let url of previewUrls">
        <img *ngIf="isImage(url)" [src]="url" class="preview-media" />
        <video *ngIf="isVideo(url)" controls [src]="url" class="preview-media"></video>
      </ng-container>
    </div>
    <div>
    <button type="submit" class="btn btn-primary">{{ isEditing ? 'Update' : 'Create' }}</button>
    <button type="button" (click)="resetForm()"  class="btn btn-secondary cancelEditBtn" *ngIf="isEditing">Cancel</button>
    </div>
  </form>

  <hr />

  <h2>All Actions</h2>
  <table>
    <thead>
      <tr>
        <th>Media</th>
        <th>Title</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let action of actions">
        <td>
          <ng-container *ngFor="let media of action.media">
            <img *ngIf="isImage(media)" [src]="'' + media" class="thumb" />
            <video *ngIf="isVideo(media)" controls [src]="'' + media" class="thumb"></video>
          </ng-container>
        </td>
        <td>{{ action.title }}</td>
        <td>{{ action.description }}</td>
        <td>
          <mat-icon class="text-success" (click)="editAction(action)">edit</mat-icon>
          <mat-icon class="text-danger" (click)="deleteAction(action._id!)">delete</mat-icon>
        </td>
      </tr>
    </tbody>
  </table>
</div>
