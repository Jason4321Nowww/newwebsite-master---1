<!-- sidebar.component.html -->
<div class="sidebar-backdrop" *ngIf="isMobile && !sidebarCollapsed" (click)="toggleSidebar()"></div>

<div id="sidebar-wrapper" [ngClass]="{ 'collapsed': sidebarCollapsed }">
  <div class="sidebar-heading d-flex justify-content-between align-items-center px-3 py-2">
    <div class="sidebar-brand" *ngIf="!sidebarCollapsed">
      <img src="assets/logo/starlinelessbigger.png" alt="BKP Logo" class="sidebar-logo" />
      <span class="sidebar-brand-text">BKP</span>
    </div>
    <img *ngIf="sidebarCollapsed && !isMobile" src="assets/logo/starlinelessbigger.png" alt="BKP Logo" class="sidebar-logo-collapsed" />
  </div>

  <div class="list-group list-group-flush my-3">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.key !== 'logout' ? ['/admin', item.key] : null"
      routerLinkActive="active-item"
      class="list-group-item list-group-item-action bg-transparent d-flex align-items-center gap-3 justify-content-start fw-500"
      (click)="selectItem(item.key)">

      <mat-icon class="menu-icon" [class.danger-icon]="item.danger">{{ item.icon }}</mat-icon>
      <span *ngIf="!sidebarCollapsed || isMobile">{{ item.label }}</span>
    </a>
  </div>
</div>
