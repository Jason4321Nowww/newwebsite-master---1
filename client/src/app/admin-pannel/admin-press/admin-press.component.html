<form (ngSubmit)="submit()" #pressForm="ngForm" class="press-form admin-card">

  <!-- Language Picker + Chips -->
  <div class="form-header">
    <span class="form-section-title">New Press Release</span>
    </div>
  <div class="lang-tabs">
    <div *ngFor="let l of selectedLangs"
         class="lang-tab"
         [class.active]="activeLang === l"
         (click)="onLangChange(l)">
      <img [src]="langMeta[l].flag" [alt]="langMeta[l].label" class="lang-flag" /><span class="lang-tab-label">{{ langMeta[l].label }}</span>
      <span *ngIf="l !== 'de'" class="lang-tab-remove" (click)="$event.stopPropagation(); removeLang(l)" title="Remove language">×</span>
    </div>
  
      <div class="lang-add-wrapper" *ngIf="availableLangs.length > 0" (click)="$event.stopPropagation()">
        <button type="button" class="lang-add-btn" (click)="showLangDropdown = !showLangDropdown" title="Add language">+</button>
        <div class="lang-add-dropdown" *ngIf="showLangDropdown && availableLangs.length > 0">
          <div *ngFor="let l of availableLangs" class="lang-add-option" (click)="onLangChange(l); showLangDropdown = false">
            <img [src]="langMeta[l].flag" [alt]="langMeta[l].label" class="lang-flag" />
            <span>{{ langMeta[l].label }}</span>
          </div>
        </div>
      </div>
    </div>

    <label *ngIf="activeLang === 'de'">Title (DE)
    <input type="text" [(ngModel)]="title" name="title" placeholder="Enter title (DE)" required />
  </label>
  <label *ngIf="activeLang === 'it'">Title (IT)
    <input type="text" [(ngModel)]="title_it" name="title_it" placeholder="Enter title (IT)" />
  </label>
  <label *ngIf="activeLang === 'fr'">Title (FR)
    <input type="text" [(ngModel)]="title_fr" name="title_fr" placeholder="Enter title (FR)" />
  </label>
  <label *ngIf="activeLang === 'en'">Title (EN)
    <input type="text" [(ngModel)]="title_en" name="title_en" placeholder="Enter title (EN)" />
  </label>

  <label *ngIf="activeLang === 'de'">Content (DE)
    <textarea [(ngModel)]="content" name="content" rows="4" placeholder="Write your press release (DE)..." required #textArea (input)="autoGrowTextArea(textArea)"></textarea>
  </label>
  <label *ngIf="activeLang === 'it'">Content (IT)
    <textarea [(ngModel)]="content_it" name="content_it" rows="4" placeholder="Write your press release (IT)..." #textAreaIt (input)="autoGrowTextArea(textAreaIt)"></textarea>
  </label>
  <label *ngIf="activeLang === 'fr'">Content (FR)
    <textarea [(ngModel)]="content_fr" name="content_fr" rows="4" placeholder="Write your press release (FR)..." #textAreaFr (input)="autoGrowTextArea(textAreaFr)"></textarea>
  </label>
  <label *ngIf="activeLang === 'en'">Content (EN)
    <textarea [(ngModel)]="content_en" name="content_en" rows="4" placeholder="Write your press release (EN)..." #textAreaEn (input)="autoGrowTextArea(textAreaEn)"></textarea>
  </label>

  <label>Image
    <input type="file" name="image" (change)="onImageSelected($event)" accept="image/*">
  </label>

  <div>
    <button type="submit" class="btn btn-primary" [disabled]="pressForm.invalid">
       Save
    </button>
  </div>
</form>

<hr />

<h2><i class="fas fa-bullhorn"></i> Saved Press Releases</h2>
<div *ngFor="let release of pressReleases" class="press-item">
  <h3>{{ release.title }}</h3>
  <p [innerHTML]="release.content"></p>
  <p class="press-date"><i>{{ release.date | date: 'medium' }}</i></p>

  <div *ngIf="release.image" class="press-image-wrap">
    <img [src]="'' + release.image" class="thumb" />
  </div>

  <div class="press-actions">
    <button (click)="openEmailDialog(release)">
      <i class="fas fa-paper-plane"></i> Send as Gmail + PDF
    </button>
    <button class="delete-btn" (click)="deletePress(release._id!)">
      <i class="fas fa-trash-alt"></i> Delete
    </button>
  </div>
</div>


<!-- Email Modal -->
<div class="email-modal" *ngIf="selectedRelease">
  <div class="email-dialog">
    <h3><i class="fas fa-paper-plane"></i> Send Press Release</h3>
    <p class="subtext">Select language, then choose recipients to send the press release as PDF.</p>

    <!-- Language selector -->
    <div class="send-lang-row">
      <label class="send-lang-label">Language</label>
      <div class="send-lang-options">
        <button
          *ngFor="let l of getAvailableSendLangs(selectedRelease)"
          type="button"
          class="send-lang-btn"
          [class.active]="sendLang === l.code"
          (click)="sendLang = l.code">
          <img [src]="l.flag" [alt]="l.label" class="send-lang-flag" />
          {{ l.label }}
        </button>
      </div>
    </div>

    <!-- Select Recipients -->
    <select multiple (change)="onSelectChange($event)">
      <optgroup label="Lists">
        <option *ngFor="let list of lists" [value]="'list:' + list">{{ list }}</option>
      </optgroup>
      <optgroup label="Individual Emails">
        <option *ngFor="let e of emails" [value]="'email:' + e.email">
          {{ e.name }} ({{ e.email }})
        </option>
      </optgroup>
    </select>

    <div class="modal-actions">
      <button (click)="confirmSend()" [disabled]="selectedRecipients.length === 0">
        <i class="fas fa-envelope-open-text"></i> Send
      </button>
      <button class="cancel" (click)="cancelSend()">Cancel</button>
    </div>
  </div>
</div>
