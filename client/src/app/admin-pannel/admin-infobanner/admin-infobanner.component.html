<!-- admin-infobanner.component.html -->
<div class="admin-page">
  <h2>Manage Info Banners</h2>

  <form [formGroup]="bannerForm" (ngSubmit)="submitForm()" class="banner-form" novalidate>

    <!-- Form header -->
    <div class="form-header">
      <span class="form-section-title">{{ selectedBanner ? 'Edit Banner' : 'New Banner' }}</span>
      <app-admin-lang-picker [activeLang]="activeLang" (langChange)="onLangChange($event)"></app-admin-lang-picker>
    </div>

    <!-- Language chips -->
    <div class="lang-chips" *ngIf="selectedLangs.length > 1">
      <span *ngFor="let l of selectedLangs"
            class="lang-chip"
            [class.active]="activeLang === l"
            (click)="onLangChange(l)">
        {{ l.toUpperCase() }}
      </span>
    </div>

    <!-- Statement — language specific -->
     <div class="actionContent">
    <div class="row" *ngIf="activeLang === 'de'">
      <label>Statement (DE) <span class="required">*</span></label>
      <textarea formControlName="statement" placeholder="Enter banner statement (DE)" (input)="autoGrow($event)"></textarea>
      <div class="error" *ngIf="bannerForm.get('statement')?.invalid && bannerForm.get('statement')?.touched">
        Statement is required.
      </div>
    </div>
    <div class="row" *ngIf="activeLang === 'it'">
      <label>Statement (IT)</label>
      <textarea formControlName="statement_it" placeholder="Enter banner statement (IT)" (input)="autoGrow($event)"></textarea>
    </div>
    <div class="row" *ngIf="activeLang === 'fr'">
      <label>Statement (FR)</label>
      <textarea formControlName="statement_fr" placeholder="Enter banner statement (FR)" (input)="autoGrow($event)"></textarea>
    </div>
    <div class="row" *ngIf="activeLang === 'en'">
      <label>Statement (EN)</label>
      <textarea formControlName="statement_en" placeholder="Enter banner statement (EN)" (input)="autoGrow($event)"></textarea>
    </div>

    <!-- Link — always visible -->
    <div class="row">
      <label>Learn More Link</label>
      <input formControlName="link" type="url" placeholder="https://example.com" />
    </div>

    <!-- Active toggle — always visible -->
    <div class="row toggle-row">
      <label class="toggle-label">
        <input type="checkbox" formControlName="isActive" />
        Set as Active Banner
      </label>
    </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-primary" [disabled]="bannerForm.invalid">
        {{ selectedBanner ? 'Update Banner' : 'Create Banner' }}
      </button>
      <button type="button" class="btn-secondary" *ngIf="selectedBanner" (click)="cancelEdit()">
        Cancel
      </button>
    </div>
  </form>

  <hr />
  <h3 class="list-heading">Banners List</h3>
  <div class="banner-list">
    <div *ngFor="let b of banners" class="banner-card">
      <div class="banner-card-content d-flex flex-row align-items-center justify-content-between">
        <div>
        <p class="banner-statement">{{ b.statement }}</p>
        <span class="status-badge" [class.active]="b.isActive">
          {{ b.isActive ? 'Active' : 'Inactive' }}
        </span>
        </div>
        <div class="card-actions">
        <button class="btn-edit" (click)="editBanner(b)">Edit</button>
        <button class="btn-toggle" (click)="toggleActive(b.id!)">
          {{ b.isActive ? 'Deactivate' : 'Activate' }}
        </button>
        <button class="btn-danger" (click)="deleteBanner(b.id!)">Delete</button>
      </div>
      </div>
      
    </div>
  </div>
</div>
