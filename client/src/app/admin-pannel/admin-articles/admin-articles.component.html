<!-- admin-articles.component.html -->
<div class="admin-page">


  <form [formGroup]="articleForm" (ngSubmit)="submit()" class="article-form admin-card" novalidate>
    <div class="articleFormWrapper">
    <!-- Form header -->
    <div class="form-header">
      <span class="form-section-title">{{ editingArticleId ? 'Edit Article' : 'New Article' }}</span>
    </div>

    <!-- Language tabs -->
    <div class="lang-tabs" *ngIf="selectedLangs.length >= 1">
      <div *ngFor="let l of selectedLangs"
           class="lang-tab"
           [class.active]="activeLang === l"
           (click)="onLangChange(l)">
        <img [src]="langMeta[l].flag" [alt]="langMeta[l].label" class="lang-flag" /><span class="lang-tab-label">{{ langMeta[l].label }}</span>
        <span *ngIf="l !== 'de'" class="lang-tab-remove" (click)="$event.stopPropagation(); removeLang(l)" title="Remove language">×</span>
      </div>
    
      <div class="lang-add-wrapper" *ngIf="availableLangs.length > 0" (click)="$event.stopPropagation()">
        <button type="button" class="lang-add-btn" (click)="showLangDropdown = !showLangDropdown" title="Add language">+</button>
        <div class="lang-add-dropdown" *ngIf="showLangDropdown && availableLangs.length > 0">
          <div *ngFor="let l of availableLangs" class="lang-add-option" (click)="onLangChange(l); showLangDropdown = false">
            <img [src]="langMeta[l].flag" [alt]="langMeta[l].label" class="lang-flag" />
            <span>{{ langMeta[l].label }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="articleContent">
    <!-- Title — language specific -->
    <div class="row" *ngIf="activeLang === 'de'">
      <label>Title (DE) <span class="required">*</span></label>
      <input formControlName="title" placeholder="German title (required)" />
    </div>
    <div class="row" *ngIf="activeLang === 'it'">
      <label>Title (IT)</label>
      <input formControlName="title_it" placeholder="Italian title (optional)" />
    </div>
    <div class="row" *ngIf="activeLang === 'fr'">
      <label>Title (FR)</label>
      <input formControlName="title_fr" placeholder="French title (optional)" />
    </div>
    <div class="row" *ngIf="activeLang === 'en'">
      <label>Title (EN)</label>
      <input formControlName="title_en" placeholder="English title (optional)" />
    </div>

    <!-- Author — always visible -->
    <div class="row">
      <label>Author</label>
      <input formControlName="author" placeholder="Author name" />
    </div>
    </div>
    <!-- DE tab: FormArray blocks -->
    <div class="blocks" *ngIf="activeLang === 'de'">
      <div class="block-controls">
        <button type="button" (click)="addTextBlock()">+ Text</button>
        <button type="button" (click)="addImageBlock()">+ Image</button>
        <button type="button" (click)="addSample()">Sample</button>
      </div>
      <div formArrayName="blocks" class="block-list">
        <div *ngFor="let block of blocks.controls; let i = index" [formGroupName]="i" class="block">
          <div *ngIf="block.get('type')?.value === 'text'">
            <label>Text</label>
            <textarea formControlName="value" placeholder="Paragraph text"
              (input)="autoGrow($event)" #descriptionTextarea></textarea>
          </div>
          <div *ngIf="block.get('type')?.value === 'image'">
            <label>Image</label>
            <div class="image-input">
              <input type="file" accept="image/*" (change)="onFileSelected($event, i)" />
              <div class="preview" *ngIf="filePreviews.get(i)">
                <img [src]="filePreviews.get(i)" alt="preview" />
              </div>
              <div class="preview" *ngIf="!filePreviews.get(i) && block.get('url')?.value">
                <img [src]="'' + block.get('url')?.value" alt="current" />
              </div>
            </div>
          </div>
          <div class="block-actions">
            <button type="button" (click)="removeBlock(i)">Remove</button>
          </div>
        </div>
      </div>
    </div>

    <!-- IT/FR/EN tabs: same block UI using plain arrays -->
    <div class="blocks" *ngIf="activeLang !== 'de'">
      <div class="block-controls">
        <button type="button" (click)="addLangTextBlock(activeLang)">+ Text</button>
        <button type="button" (click)="addLangImageBlock(activeLang)">+ Image</button>
        <button type="button" (click)="addLangSample(activeLang)">Sample</button>
      </div>
      <div class="block-list">
        <div *ngFor="let block of langBlocks[activeLang]; let i = index" class="block">
          <div *ngIf="block.type === 'text'">
            <label>Text</label>
            <textarea [(ngModel)]="block.value" [ngModelOptions]="{standalone: true}"
              placeholder="Paragraph text" (input)="autoGrow($event)"></textarea>
          </div>
          <div *ngIf="block.type === 'image'">
            <label>Image</label>
            <div class="image-input">
              <input type="file" accept="image/*" (change)="onLangFileSelected($event, activeLang, i)" />
              <div class="preview" *ngIf="langFilePreviews[activeLang].get(i)">
                <img [src]="langFilePreviews[activeLang].get(i)" alt="preview" />
              </div>
              <div class="preview" *ngIf="!langFilePreviews[activeLang].get(i) && block.url">
                <img [src]="'' + block.url" alt="current" />
              </div>
            </div>
          </div>
          <div class="block-actions">
            <button type="button" (click)="removeLangBlock(activeLang, i)">Remove</button>
          </div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary">{{ editingArticleId ? 'Update' : 'Create' }} Article</button>
      <button type="button" class="btn-secondary" (click)="cancelEdit()" *ngIf="editingArticleId">Cancel</button>
    </div>
  </div>
  </form>

  <hr />
  <h3 class="list-heading">Articles List</h3>
  <div class="article-list">
    <div *ngFor="let a of articles" class="article-card">
      <h3>{{ a.title }}</h3>
      <p><strong>Author:</strong> {{ a.author }}</p>
      <div class="preview-body">
        <ng-container *ngFor="let b of a.body">
          <img *ngIf="b.type === 'image' && b.url" [src]="'' + b.url" />
          <p *ngIf="b.type === 'text'">{{ b.value | slice: 0:215 }}...</p>
        </ng-container>
      </div>
      <div class="card-actions">
        <button class="btn-edit" (click)="editArticle(a)">Edit</button>
        <button class="btn-danger" (click)="deleteArticle(a.id)">Delete</button>
      </div>
    </div>
  </div>
</div>
