<!-- admin-dashboard -->
<div class="d-flex" id="wrapper">
  <app-sidebar (itemSelected)="onItemSelected($event)"></app-sidebar>

  <div id="page-content-wrapper" class="flex-grow-1">

    <!-- Consistent page header bar -->
    <div class="admin-page-header" *ngIf="pageTitle">
      <div class="admin-page-header__inner">
        <mat-icon class="admin-page-header__icon">{{ pageIcon }}</mat-icon>
        <span class="admin-page-header__title">{{ pageTitle }}</span>
      </div>
    </div>

    <div class="page-body">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
