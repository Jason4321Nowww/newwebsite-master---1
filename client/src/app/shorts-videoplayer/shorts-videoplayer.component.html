<!-- Portrait Video Carousel -->
<div class="carousel1" *ngIf="portraitItems.length > 0">
  <div class="carousel1-wrapper">

    <button class="carousel-nav prev" (click)="prevPortrait()" type="button" aria-label="Previous video">&#10094;</button>

    <div class="carousel1-stage" [style.width.px]="portraitStageWidth">
      <div *ngFor="let slot of portraitSlots; let i = index"
           class="portrait-slot"
           [class.no-transition]="portraitNoTransition"
           [class.is-center]="slot.isCenter"
           [style.transform]="getPortraitTransform(i)"
           [style.opacity]="getPortraitOpacity(i)"
           [style.zIndex]="getPortraitZIndex(i)"
           (click)="clickPortraitSlot(i)">
        <app-shorts-video [videoInfo]="slot.video" [isActive]="slot.isCenter"></app-shorts-video>
      </div>
    </div>

    <button class="carousel-nav next" (click)="nextPortrait()" type="button" aria-label="Next video">&#10095;</button>

  </div>
</div>

<!-- Landscape Video Carousel -->

  </div>
</div>
