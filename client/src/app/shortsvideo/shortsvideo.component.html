<div class="short-container" [class.landscape]="isLandscape">

  <div class="videotitle" [class.landscape]="isLandscape">{{ getTitle(langService.lang$ | async) }}</div>

  <!-- Thumbnail shown until user clicks play -->
  <div *ngIf="!playing"
       class="thumbnail-wrap"
       [class.landscape]="isLandscape"
       (click)="play()">
    <img class="thumbnail" [src]="thumbnailUrl" alt="" />
    <div class="play-btn">
      <svg viewBox="0 0 68 48" xmlns="http://www.w3.org/2000/svg">
        <path class="play-btn-bg"  d="M66.5 7.7a8.5 8.5 0 0 0-6-6C56 0 34 0 34 0S12 0 7.5 1.7a8.5 8.5 0 0 0-6 6C0 12.1 0 24 0 24s0 11.9 1.5 16.3a8.5 8.5 0 0 0 6 6C12 48 34 48 34 48s22 0 26.5-1.7a8.5 8.5 0 0 0 6-6C68 35.9 68 24 68 24s0-11.9-1.5-16.3z"/>
        <path class="play-btn-icon" d="M45 24 27 14v20z"/>
      </svg>
    </div>
    <button class="fullscreen-btn" (click)="openFullscreen($event)" title="Fullscreen">
      <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
    </button>
  </div>

  <!-- Iframe wrapper — this entire div goes fullscreen so close button stays visible -->
  <div *ngIf="playing" class="iframe-wrap" [class.landscape]="isLandscape" #wrapEl>
    <iframe
      class="short-video"
      [src]="videoUrl"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
      allowfullscreen
      webkitallowfullscreen
      mozallowfullscreen
    ></iframe>

    <!-- Fullscreen button (shown when not fullscreen) -->
    <button *ngIf="!isFullscreen" class="fullscreen-btn" (click)="openFullscreen($event)" title="Fullscreen">
      <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
    </button>

    <!-- Close/exit fullscreen button (shown only when in fullscreen) -->
    <button *ngIf="isFullscreen" class="close-fs-btn" (click)="exitFullscreen($event)" title="Exit fullscreen">
      ✕
    </button>
  </div>

</div>
