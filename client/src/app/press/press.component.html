<div class="press-page">
  <h1 class="page-title scroll-reveal">{{ langService.t('nav.press') }}</h1>

  <div class="press-grid stagger" *ngIf="releases.length > 0; else empty">
    <div class="press-card scroll-reveal" *ngFor="let release of releases" (click)="openRelease(release._id!)">

      <div class="press-card-image" *ngIf="release.image">
        <img [src]="'http://localhost:5000' + release.image" alt="Press image" />
      </div>

      <div class="press-card-body">
        <h2 class="press-card-title">{{ langService.getField(release, 'title') }}</h2>
        <p class="press-card-excerpt">{{ getExcerpt(release) }}</p>
        <div class="press-card-footer">
          <span class="press-date">
            <mat-icon inline>calendar_today</mat-icon>
            {{ release.date | date: 'dd-MM-yyyy' }}
          </span>
        </div>
      </div>

    </div>
  </div>

  <ng-template #empty>
    <p class="no-releases">No press releases available.</p>
  </ng-template>
</div>
