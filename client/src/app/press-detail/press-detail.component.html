<div class="press-detail-wrapper" *ngIf="release">
  <div class="press-card">

    <h1 class="press-title">{{ langService.getField(release, 'title') }}</h1>

    <img *ngIf="release.image"
         [src]="'' + release.image"
         class="press-image"
         (click)="openLightbox('' + release.image)"
         title="Click to enlarge" />

    <div class="press-content"
         [innerHTML]="langService.getField(release, 'content')">
    </div>

    <div class="press-date">
      <mat-icon>calendar_today</mat-icon>
      {{ release.date | date: 'dd-MM-yyyy' }}
    </div>

  </div>
</div>

<!-- Lightbox -->
<div class="lightbox-backdrop" *ngIf="lightboxSrc" (click)="closeLightbox()">
  <button class="lightbox-close" (click)="closeLightbox()">✕</button>
  <img [src]="lightboxSrc" class="lightbox-img" (click)="$event.stopPropagation()" />
</div>
