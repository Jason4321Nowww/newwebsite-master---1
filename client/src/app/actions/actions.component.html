<div class="gallery-container">
  <h2 class="gallery-heading scroll-reveal">{{ langService.t('actions.gallery') }}</h2>

  <div class="gallery-grid stagger">
    <div class="gallery-card" *ngFor="let action of allActions" (click)="openCard($event, cardGallery)">

      <lightgallery #cardGallery [settings]="settings" class="card-gallery" (onInit)="onGalleryInit($event)">

      <a
          *ngFor="let item of action.media; let i = index"
          [class.gallery-hidden]="i > 0"
          [attr.data-src]="isImage(item) ? item : null"
          [attr.data-video]="isVideo(item) ? videoData(item) : null"
          [attr.data-sub-html]="'<h4>' + langService.getField(action, 'title') + '</h4><p>' + langService.getField(action, 'description') + '</p>'"
        >
          <!--
            Always render <img> so lightgallery thumbnail strip can read it.
            i=0 → visible card thumbnail; i>0 → hidden by parent but src still readable by lightgallery.
          -->
          <img
            [src]="isImage(item) ? item : (videoThumbs.get(item) || videoPlaceholder)"
            class="card-thumb"
            alt=""
          />
          <!-- play icon overlay on card for first video item -->
          <mat-icon *ngIf="isVideo(item) && i === 0" class="play-icon">play_circle</mat-icon>
        </a>
      </lightgallery>

      <div class="gallery-info">
        <h3>{{ langService.getField(action, 'title') }}</h3>
        <p>{{ (langService.getField(action, 'description') | slice: 0:100) }}...</p>
      </div>

    </div>
  </div>
</div>
