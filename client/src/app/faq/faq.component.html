<div class="faq-container">

  <h2 class="faq-title scroll-reveal">{{ langService.t('faq.title') }}</h2>

  <mat-accordion class="faq-accordion scroll-reveal" multi>
    <mat-expansion-panel *ngFor="let faq of faqs" [(expanded)]="faq.expanded" hideToggle>
      <mat-expansion-panel-header>
        <mat-panel-title>{{ langService.t(faq.key + '.question') }}</mat-panel-title>
        <mat-icon class="faq-icon" [class.open]="faq.expanded">expand_more</mat-icon>
      </mat-expansion-panel-header>
      <p class="faq-answer">{{ langService.t(faq.key + '.answer') }}</p>
    </mat-expansion-panel>
  </mat-accordion>

</div>
